# Include ONLY in the HTTPS server block whose server_name is EXACTLY iamm.xyz.
# Current host block is shared with www: split/copy unchanged existing host
# behavior first, as documented in docs/DEPLOYMENT.md. Never include globally.
location = /mira {
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    if (!-f /etc/mira-cafe.ready) {
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mira Café</title><p>咖啡馆尚未开放，请稍后再来。</p></html>';
    }
    return 308 /mira/;
}
location ^~ /mira/ {
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    if (!-f /etc/mira-cafe.ready) {
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mira Café</title><p>咖啡馆尚未开放，请稍后再来。</p></html>';
    }
    # No URI suffix: preserve /mira/... for application routing/authentication.
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replace rather than append client-provided forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $mira_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    client_max_body_size 64k;
}
